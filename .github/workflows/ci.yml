name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Необхідно для SonarCloud

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov pytest-django
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 1. Lint & Build (flake8)
        run: |
          flake8 . --count --show-source --statistics

      - name: 2. Run Tests (pytest, pytest-cov)
        run: |
          pytest --cov=. --cov-report=xml --cov-report=html

      - name: 3. Quality Gate (SonarCloud Scan)
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.qualitygate.wait=true

      - name: 4. Artifacts
        uses: actions/upload-artifact@v4
        if: always() # Зберігаємо артефакти навіть якщо тести впали
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
